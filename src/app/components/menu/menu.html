<div class="kiosk-layout">
  
  <app-sidebar 
    [elencoCategorie]="listaCategorie"
    [idSelezionato]="categoriaCorrente()"
    (categoriaCambiata)="aggiornaFiltro($event)">
  </app-sidebar>

  <main class="main-content">
    <header class="content-header">
      <h2>Seleziona i tuoi prodotti</h2>
    </header>
    
    <div class="grid-prodotti">
      @for(prodotto of prodottiFiltrati(); track prodotto.datiBruti.id) {
        <app-product-card [item]="prodotto"></app-product-card>
      } @empty {
        <div class="empty-state">
          <p>Nessun prodotto disponibile in questa categoria.</p>
        </div>
      }
    </div>
  </main>

  <div class="kiosk-footer" [routerLink]="['/carrello']">
    <div class="cart-summary-btn">
      <span class="cart-icon">🛒 Vedi Carrello dell'Ordine</span>
      @if (cartService.totalePezzi() > 0) {
        <span class="cart-badge">{{ cartService.totalePezzi() }}</span>
      }
    </div>
  </div>

</div>
