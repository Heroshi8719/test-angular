<div class="detail-container">
  @if (prodotto(); as item) {
    <button class="back-btn" routerLink="/">⬅ Torna al Menu</button>

    <div class="detail-card">
      <div class="image-section">
        <img [src]="item.getImage()" [alt]="item.getNome()">
      </div>

      <div class="info-section">
        <span class="category-badge">{{ item.datiBruti.categoria }}</span>
        <h1 class="product-title">{{ item.getNome() }}</h1>
        <p class="product-description">
          {{ item.datiBruti.descrizione || 'Preparato fresco al momento su ordinazione.' }}
        </p>

        <div class="footer-section">
          <div class="price-tag">{{ (item.prezzo * quantitaSelezionata()).toFixed(2) }} €</div>
          
          <app-quantity [valore]="quantitaSelezionata()" (cambio)="quantitaSelezionata.set($event)"></app-quantity>
          
          <button class="cart-btn" (click)="aggiungiAlCarrello()">🛒 Aggiungi al Carrello</button>
        </div>
      </div>
    </div>
  }
</div>
